tool_output_token_limit = 4000

[agents]
max_concurrent_threads_per_session = 4

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/pre-tool-use.sh"'
timeout = 5
statusMessage = "Codex framework guard"
