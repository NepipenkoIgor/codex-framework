[agents]
max_concurrent_threads_per_session = 4
max_depth = 1

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/pre-tool-use.sh"'
timeout = 5
statusMessage = "Codex framework guard"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/stop.sh"'
timeout = 30
statusMessage = "Checking changed files"
