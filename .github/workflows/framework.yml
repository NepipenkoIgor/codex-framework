name: Framework

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_CLI_VERSION: 0.154.0

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install framework system dependencies
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo apt-get update && sudo apt-get install --yes ripgrep
          elif ! command -v rg >/dev/null; then
            brew install ripgrep
          fi
      - name: Install pinned Codex CLI
        run: npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
      - name: Syntax and compile checks
        run: |
          find scripts plugins -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m compileall -q scripts
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/codex-frontend-design/.codex-plugin/plugin.json >/dev/null
      - name: Framework source health
        run: bash scripts/framework-health.sh
      - name: Project pack and doctor fixtures
        run: |
          bash scripts/framework-skill-sync.sh .
          bash scripts/framework-doctor-self-test.sh
      - name: Fresh-checkout reproducibility
        run: |
          fixture="$(mktemp -d)"
          git worktree add --detach "$fixture" HEAD
          trap 'git worktree remove --force "$fixture"' EXIT
          bash "$fixture/scripts/framework-health.sh"
      - name: Release evidence rejects fabricated attestations
        run: python3 scripts/framework-release-evidence.py self-test
      - name: Release evidence is current for source and pinned runtime
        run: python3 scripts/framework-release-evidence.py check
