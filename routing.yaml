version: 1

models:
  low:
    model: gpt-5.4-mini
    reasoning: low
    use_for:
      - mechanical changes
      - PR publishing and commit mechanics
      - quick repo questions
      - narrow single-file work
  medium:
    model: gpt-5.5
    reasoning: medium
    use_for:
      - standard feature work
      - most debugging
      - normal review and test work
  high:
    model: gpt-5.5
    reasoning: high
    use_for:
      - architecture
      - multi-system changes
      - hard debugging
      - migrations
  xhigh:
    model: gpt-5.5
    reasoning: xhigh
    use_for:
      - unusually ambiguous or high-risk work
      - second-attempt rescue work
      - strategic framework status and orchestration audits

