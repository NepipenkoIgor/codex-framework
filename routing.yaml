version: 1

models:
  low:
    model: codex-mini-latest
    reasoning: low
    use_for:
      - mechanical changes
      - quick repo questions
      - narrow single-file work
  medium:
    model: gpt-5.4-mini
    reasoning: medium
    use_for:
      - standard feature work
      - most debugging
      - normal review and test work
  high:
    model: gpt-5.4
    reasoning: high
    use_for:
      - architecture
      - multi-system changes
      - hard debugging
      - migrations
  xhigh:
    model: gpt-5.4
    reasoning: xhigh
    use_for:
      - unusually ambiguous or high-risk work
      - second-attempt rescue work

roles:
  architect:
    signals:
      - design
      - architecture
      - api contract
      - schema
      - tradeoff
      - technical plan
    skills:
      - api-design
      - backend-architecture
      - frontend-architecture
    tier: high
  builder:
